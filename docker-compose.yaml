services:
  alt-tab:
    image: "knight7024/alt-tab:latest"
    container_name: "alt-tab"
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - backend

  mongodb:
    image: "mongodb/mongodb-community-server:8.0.4-ubi9"
    container_name: "mongodb"
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongodb:/data/db
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:4.0.8-management-alpine
    container_name: "rabbitmq"
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    networks:
      - backend

networks:
  backend:
    driver: bridge
